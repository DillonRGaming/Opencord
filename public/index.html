<!doctype html>
<html lang="en" data-theme="onyx">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111411">
  <title>Opencord</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap">
  <!-- The app's own styles sit in a cascade layer, so anything in a user's custom CSS wins over them
       without needing !important or extra-specific selectors. -->
  <style>
    @import url("/css/theme.css") layer(app);
    @import url("/css/layout.css") layer(app);
    @import url("/css/components.css") layer(app);
    @import url("/css/chat.css") layer(app);
    @import url("/css/fun.css") layer(app);
  </style>
  <style id="theme-vars"></style>
  <style id="custom-css"></style>
</head>
<body>
  <div id="app"></div>
  <div id="layers"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
