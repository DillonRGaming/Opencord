[package]
name = "opencord"
version = "0.1.0"
description = "Opencord"
edition = "2021"

[lib]
name = "opencord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
serde_json = "1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2.4.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"

[profile.release]
lto = "thin"
opt-level = "s"
strip = true
